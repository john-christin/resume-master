<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- === Calibri / Cambria (Microsoft Office defaults) === -->
  <alias>
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Cambria</family>
    <prefer><family>Caladea</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Arial / Helvetica family === -->
  <alias>
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Arial Narrow</family>
    <prefer><family>Liberation Sans</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>TeX Gyre Heros</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Helvetica Neue</family>
    <prefer><family>TeX Gyre Heros</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- === Times New Roman family === -->
  <alias>
    <family>Times New Roman</family>
    <prefer><family>TeX Gyre Termes</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Times</family>
    <prefer><family>TeX Gyre Termes</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Palatino / Book Antiqua family === -->
  <!-- Book Antiqua is Microsoft's licensed version of Palatino -->
  <alias>
    <family>Book Antiqua</family>
    <prefer><family>TeX Gyre Pagella</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Palatino</family>
    <prefer><family>TeX Gyre Pagella</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Palatino Linotype</family>
    <prefer><family>TeX Gyre Pagella</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Garamond family === -->
  <alias>
    <family>Garamond</family>
    <prefer><family>EB Garamond</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Cormorant Garamond</family>
    <prefer><family>EB Garamond</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Century Gothic / Avant Garde (geometric sans) === -->
  <alias>
    <family>Century Gothic</family>
    <prefer><family>TeX Gyre Adventor</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Futura</family>
    <prefer><family>TeX Gyre Adventor</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Avant Garde</family>
    <prefer><family>TeX Gyre Adventor</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- === Century Schoolbook === -->
  <alias>
    <family>Century Schoolbook</family>
    <prefer><family>TeX Gyre Schola</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Century</family>
    <prefer><family>TeX Gyre Schola</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>New Century Schoolbook</family>
    <prefer><family>TeX Gyre Schola</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Bookman Old Style === -->
  <alias>
    <family>Bookman Old Style</family>
    <prefer><family>TeX Gyre Bonum</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Bookman</family>
    <prefer><family>TeX Gyre Bonum</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Courier New / Courier === -->
  <alias>
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
    <default><family>monospace</family></default>
  </alias>
  <alias>
    <family>Courier</family>
    <prefer><family>TeX Gyre Cursor</family></prefer>
    <default><family>monospace</family></default>
  </alias>

  <!-- === Georgia === -->
  <alias>
    <family>Georgia</family>
    <prefer><family>TeX Gyre Termes</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Verdana / Tahoma (humanist sans) === -->
  <alias>
    <family>Verdana</family>
    <prefer><family>Liberation Sans</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Tahoma</family>
    <prefer><family>Liberation Sans</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- === Trebuchet MS === -->
  <alias>
    <family>Trebuchet MS</family>
    <prefer><family>TeX Gyre Heros</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- === Gill Sans === -->
  <alias>
    <family>Gill Sans</family>
    <prefer><family>URW Gothic</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>Gill Sans MT</family>
    <prefer><family>URW Gothic</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- === Optima === -->
  <alias>
    <family>Optima</family>
    <prefer><family>URW Gothic</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- === Baskerville === -->
  <alias>
    <family>Baskerville</family>
    <prefer><family>TeX Gyre Pagella</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Baskerville Old Face</family>
    <prefer><family>TeX Gyre Pagella</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Didot === -->
  <alias>
    <family>Didot</family>
    <prefer><family>TeX Gyre Pagella</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Minion / Minion Pro === -->
  <alias>
    <family>Minion Pro</family>
    <prefer><family>EB Garamond</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Minion</family>
    <prefer><family>EB Garamond</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- === Caslon === -->
  <alias>
    <family>Adobe Caslon Pro</family>
    <prefer><family>EB Garamond</family></prefer>
    <default><family>serif</family></default>
  </alias>
  <alias>
    <family>Big Caslon</family>
    <prefer><family>EB Garamond</family></prefer>
    <default><family>serif</family></default>
  </alias>
</fontconfig>
