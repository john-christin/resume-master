services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Override .env: reach the host's Postgres from inside the container
      DATABASE_URL: postgresql+psycopg2://root:john_root@host.docker.internal:5432/resume_master
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  uploads:
